services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: cellar
      POSTGRES_USER: user
      POSTGRES_PASSWORD: dev-only
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myapp -d myapp_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
